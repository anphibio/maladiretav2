services:
  postgres:
    image: postgres:16-alpine
    container_name: maladireta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maladireta
      POSTGRES_USER: maladireta
      POSTGRES_PASSWORD: maladireta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maladireta -d maladireta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maladireta-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: worker
    container_name: maladireta-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maladireta:maladireta@postgres:5432/maladireta
      REDIS_URL: redis://redis:6379
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    container_name: maladireta-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maladireta:maladireta@postgres:5432/maladireta
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    container_name: maladireta-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maladireta:maladireta@postgres:5432/maladireta
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
